#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "kula"
name = "Kula"
description.en = "Server monitoring tool"
description.fr = "Outil de surveillance des serveurs"

version = "0.15.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://kula.ovh/"
demo = "https://demo.kula.ovh/"
admindoc = "https://github.com/c0m4r/kula?tab=readme-ov-file#-installation"
code = "https://github.com/c0m4r/kula"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/kula"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["ar", "de", "en", "es", "fr", "hi", "ja", "ko", "pl", "pt", "zh"]
    default = "fr"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/c0m4r/kula/releases/download/0.15.0/kula-0.15.0-amd64.tar.gz"
    sha256 = "92a189984672566cc3f31deee22926c25fbbf6370ba361f9b326fe43010b5d60"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
